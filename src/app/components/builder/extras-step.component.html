@if (view$ | async; as view) {
  <section aria-labelledby="bebidas-passo-title">
    <h3 id="bebidas-passo-title" class="text-lg font-semibold">Bebidas <span class="font-sans text-sm font-normal text-cream-muted">(opcional)</span></h3>
    <p class="mt-1 text-sm text-cream-muted">A bebida vai direto para o carrinho.</p>
    <div class="mt-4"><app-drink-picker></app-drink-picker></div>
  </section>

  <section class="mt-8 sm:mt-10" aria-labelledby="obs-title">
    <h3 id="obs-title" class="text-lg font-semibold">Observações da pizza <span class="font-sans text-sm font-normal text-cream-muted">(opcional)</span></h3>

    <label for="obs-pizza" class="field-label mt-4">Alguma observação para esta pizza?</label>
    <textarea
      id="obs-pizza"
      class="field-input"
      rows="3"
      maxlength="300"
      placeholder="Ex.: sem cebola, calabresa com catupiry, bem assada"
      [ngModel]="view.draft.notes"
      (ngModelChange)="setNotes($event)"
    ></textarea>
    <span class="field-hint">{{ view.draft.notes.length }}/300 caracteres</span>
  </section>
}
