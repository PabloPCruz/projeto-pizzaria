<section id="contatos" class="section border-t border-ink-500/40 bg-ink-800/40" aria-labelledby="contatos-title">
  <div class="container-page">
    <div class="mx-auto max-w-2xl text-center" appReveal>
      <p class="eyebrow">Fale com a gente</p>
      <h2 id="contatos-title" class="section-title">Contatos e horário</h2>
      <div class="rule-gold mx-auto max-w-[10rem]" aria-hidden="true"></div>
    </div>

    <dl class="mt-8 grid grid-cols-1 gap-3 sm:mt-10 sm:grid-cols-2 sm:gap-5" appReveal>
      <div class="card flex items-start gap-4 p-5 sm:p-6">
        <span class="mt-0.5 text-gold"><lucide-icon name="phone" [size]="24"></lucide-icon></span>
        <div>
          <dt class="text-[0.8125rem] font-semibold uppercase tracking-[0.16em] text-gold">Telefone</dt>
          <dd class="mt-1">
            <a [href]="phoneUrl" class="link-row inline-flex min-h-[44px] items-center text-lg text-cream hover:text-gold"><span class="link-slide">{{ store.phoneDisplay }}</span></a>
          </dd>
        </div>
      </div>

      <div class="card flex items-start gap-4 p-5 sm:p-6">
        <span class="mt-0.5 text-gold"><app-brand-icon name="whatsapp" [size]="24"></app-brand-icon></span>
        <div>
          <dt class="text-[0.8125rem] font-semibold uppercase tracking-[0.16em] text-gold">WhatsApp</dt>
          <dd class="mt-1">
            <a
              [href]="whatsappUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="link-row inline-flex min-h-[44px] items-center text-lg text-cream hover:text-gold"
            ><span class="link-slide">{{ store.whatsappDisplay }}</span><span class="sr-only"> (abre em nova aba)</span></a>
          </dd>
        </div>
      </div>

      <div class="card flex items-start gap-4 p-5 sm:col-span-2 sm:p-6">
        <span class="mt-0.5 text-gold"><lucide-icon name="clock" [size]="24"></lucide-icon></span>
        <div>
          <dt class="text-[0.8125rem] font-semibold uppercase tracking-[0.16em] text-gold">Horário</dt>
          <dd class="mt-1 text-lg text-cream">{{ hoursText }}</dd>
          <dd class="mt-1 text-sm text-cream-muted">{{ closedDaysText }} · {{ store.promoNotice }}</dd>
        </div>
      </div>
    </dl>

    <ul class="mt-6 flex flex-wrap justify-center gap-3 sm:mt-8" aria-label="Redes sociais">
      <li>
        <a [href]="store.social.instagram" target="_blank" rel="noopener noreferrer" class="btn-ghost gap-2">
          <app-brand-icon name="instagram" [size]="20"></app-brand-icon>Instagram<span class="sr-only"> (abre em nova aba)</span>
        </a>
      </li>
      <li>
        <a [href]="store.social.facebook" target="_blank" rel="noopener noreferrer" class="btn-ghost gap-2">
          <app-brand-icon name="facebook" [size]="20"></app-brand-icon>Facebook<span class="sr-only"> (abre em nova aba)</span>
        </a>
      </li>
    </ul>
  </div>
</section>
